basePath: /
definitions:
  handlers.HealthResponse:
    properties:
      message:
        type: string
      status:
        type: string
      version:
        type: string
    type: object
  models.AnalysisMode:
    enum:
    - SINGLE
    - GROUP
    type: string
    x-enum-varnames:
    - ModeSingle
    - ModeGroup
  models.BrainZone:
    enum:
    - FRONTAL
    - PARIETAL
    - CENTRAL
    - TEMPORAL
    - OCCIPITAL
    type: string
    x-enum-varnames:
    - BrainZoneFrontal
    - BrainZoneParietal
    - BrainZoneCentral
    - BrainZoneTemporal
    - BrainZoneOccipital
  models.EEGAnalysisRequest:
    properties:
      analysisId:
        type: string
      analysisMode:
        $ref: '#/definitions/models.AnalysisMode'
      brainZone:
        $ref: '#/definitions/models.BrainZone'
      file:
        allOf:
        - $ref: '#/definitions/models.EEGFileConfig'
        description: For SINGLE mode
      files:
        description: For GROUP mode
        items:
          $ref: '#/definitions/models.EEGFileConfig'
        type: array
      filterParams:
        $ref: '#/definitions/models.EEGFilterParams'
      rhythm:
        $ref: '#/definitions/models.RhythmType'
      rhythms:
        items:
          $ref: '#/definitions/models.RhythmType'
        type: array
    required:
    - analysisId
    - analysisMode
    type: object
  models.EEGAnalysisResponse:
    properties:
      absolutePowers:
        description: '[[RhythmType, number]]'
        items:
          items: {}
          type: array
        type: array
      analysisId:
        type: string
      analysisMode:
        $ref: '#/definitions/models.AnalysisMode'
      dataByExperiment:
        additionalProperties:
          $ref: '#/definitions/models.EEGPlotPair'
        type: object
      dataByRhythm:
        additionalProperties:
          $ref: '#/definitions/models.EEGPlotPair'
        type: object
      experimentName:
        description: For SINGLE mode
        type: string
      experimentNames:
        description: For GROUP mode
        items:
          type: string
        type: array
      filterParams:
        $ref: '#/definitions/models.EEGFilterParams'
      relativePowers:
        description: '[[RhythmType, number]]'
        items:
          items: {}
          type: array
        type: array
      rhythm:
        $ref: '#/definitions/models.RhythmType'
      rhythms:
        items:
          $ref: '#/definitions/models.RhythmType'
        type: array
    required:
    - analysisId
    - analysisMode
    type: object
  models.EEGCombinedDataPoint:
    additionalProperties:
      format: float64
      type: number
    type: object
  models.EEGFileConfig:
    properties:
      amplitudeColumn:
        type: string
      experimentName:
        type: string
      filename:
        type: string
      id:
        type: string
      rawFile:
        description: Base64 encoded CSV content
        type: string
      serverId:
        description: Can be ignored
        type: string
      timeColumn:
        type: string
    required:
    - amplitudeColumn
    - experimentName
    - filename
    - id
    - timeColumn
    type: object
  models.EEGFilterParams:
    properties:
      filterMax:
        description: Butterworth high cutoff (Hz)
        type: number
      filterMin:
        description: Butterworth low cutoff (Hz)
        type: number
      filterOrder:
        description: Butterworth filter order
        type: integer
      nOverlap:
        description: Welch overlap size
        type: integer
      nPerSeg:
        description: Welch segment size
        type: integer
    type: object
  models.EEGLinePlot:
    properties:
      data:
        items:
          $ref: '#/definitions/models.EEGCombinedDataPoint'
        type: array
      xHighlightRange:
        description: For highlighting frequency bands in PSD
        items:
          type: number
        type: array
    required:
    - data
    type: object
  models.EEGPlotPair:
    properties:
      psdPlot:
        $ref: '#/definitions/models.EEGLinePlot'
      signalPlot:
        $ref: '#/definitions/models.EEGLinePlot'
    required:
    - psdPlot
    - signalPlot
    type: object
  models.EEGPreviewResponse:
    properties:
      experimentName:
        type: string
      plot:
        $ref: '#/definitions/models.EEGPlotPair'
      previewId:
        type: string
      rhythm:
        $ref: '#/definitions/models.RhythmType'
    required:
    - experimentName
    - plot
    - previewId
    - rhythm
    type: object
  models.RhythmType:
    enum:
    - ALPHA
    - BETA
    - GAMMA
    - DELTA
    - THETA
    - KAPPA
    - LAMBDA
    - MU
    type: string
    x-enum-comments:
      RhythmAlpha: 8–13 Hz
      RhythmBeta: 13–30 Hz
      RhythmDelta: 0.5–4 Hz
      RhythmGamma: 30–100 Hz
      RhythmKappa: 8–13 Hz
      RhythmLambda: 4–8 Hz
      RhythmMu: 8–13 Hz
      RhythmTheta: 4–8 Hz
    x-enum-descriptions:
    - 8–13 Hz
    - 13–30 Hz
    - 30–100 Hz
    - 0.5–4 Hz
    - 4–8 Hz
    - 8–13 Hz
    - 4–8 Hz
    - 8–13 Hz
    x-enum-varnames:
    - RhythmAlpha
    - RhythmBeta
    - RhythmGamma
    - RhythmDelta
    - RhythmTheta
    - RhythmKappa
    - RhythmLambda
    - RhythmMu
host: localhost:3000
info:
  contact:
    email: support@example.com
    name: API Support
  description: |-
    REST API for analyzing EEG (electroencephalography) data
    Supports single-file and multi-file analysis with various brain rhythm bands
  license:
    name: MIT
  title: EEG Analyzer API
  version: "1.0"
paths:
  /analyze:
    post:
      consumes:
      - application/json
      description: Performs EEG analysis in SINGLE or GROUP mode
      parameters:
      - description: Analysis Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.EEGAnalysisRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.EEGAnalysisResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Analyze EEG data
      tags:
      - analysis
  /health:
    get:
      description: Returns the health status of the API
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
      summary: Health check endpoint
      tags:
      - health
  /preview:
    post:
      consumes:
      - multipart/form-data
      description: Shows how filters will affect the signal before full analysis (multipart/form-data)
      parameters:
      - description: Preview ID
        in: formData
        name: previewId
        required: true
        type: string
      - description: CSV file
        in: formData
        name: file
        required: true
        type: file
      - description: Experiment name
        in: formData
        name: experimentName
        required: true
        type: string
      - description: Rhythm type (ALPHA, BETA, etc.)
        in: formData
        name: rhythm
        required: true
        type: string
      - description: Filter parameters as JSON string
        in: formData
        name: filterParams
        type: string
      - description: 'Time column name (default: time)'
        in: formData
        name: timeColumn
        type: string
      - description: 'Amplitude column name (default: amplitude)'
        in: formData
        name: amplitudeColumn
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.EEGPreviewResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Preview EEG signal with filter parameters
      tags:
      - analysis
swagger: "2.0"
